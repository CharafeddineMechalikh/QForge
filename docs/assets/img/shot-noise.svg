<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="sn-title sn-desc">
  <title id="sn-title">Exact probabilities compared with sampled counts</title>
  <desc id="sn-desc">Left: the exact state of a qubit prepared with a Hadamard gives probability one half for outcomes zero and one. Right: one run of 100 shots returned 46 zeros and 54 ones, close to but not exactly one half.</desc>
  <defs>
    <marker id="sn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="fill-orange" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 14px; font-weight: 600; text-anchor: middle; fill: #151a2b; }
    .tick { font-size: 12px; text-anchor: end; fill: #5a6478; }
    .bar-label { font-size: 14px; font-weight: 600; text-anchor: middle; fill: #151a2b; }
    .value { font-size: 12px; text-anchor: middle; fill: #5a6478; }
    .small { font-size: 11px; text-anchor: middle; fill: #5a6478; }
    .panel { fill: #f5f7fd; stroke: #e1e6f0; stroke-width: 1.5; }
    .axis { stroke: #cbd3e4; stroke-width: 1.4; fill: none; }
    .bar { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .bar-two { fill: #fff1e6; stroke: #ea580c; stroke-width: 2; }
    .ideal { stroke: #5a6478; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; }
    .arrow { stroke: #ea580c; stroke-width: 2.4; fill: none; }
    .fill-orange { fill: #ea580c; }
    @media (prefers-color-scheme: dark) {
      .title, .bar-label { fill: #e6eaf4; }
      .tick, .value, .small { fill: #9aa6bd; }
      .panel { fill: #111728; stroke: #212a3f; }
      .axis { stroke: #303c56; }
      .bar { fill: #1b1c3f; stroke: #a5b4fc; }
      .bar-two { fill: #2a1d12; stroke: #fb923c; }
      .ideal { stroke: #9aa6bd; }
      .arrow { stroke: #fb923c; }
      .fill-orange { fill: #fb923c; }
    }
  </style>

  <rect class="panel" x="30" y="25" width="330" height="275" rx="14"/>
  <rect class="panel" x="480" y="25" width="330" height="275" rx="14"/>

  <text class="title" x="195" y="58">Exact state</text>
  <text class="title" x="645" y="58">100 shots, seed 6</text>

  <line class="axis" x1="75" y1="85" x2="75" y2="250"/>
  <line class="axis" x1="70" y1="90" x2="80" y2="90"/>
  <line class="axis" x1="70" y1="170" x2="80" y2="170"/>
  <line class="axis" x1="70" y1="250" x2="80" y2="250"/>
  <text class="tick" x="66" y="94">1</text>
  <text class="tick" x="66" y="174">&#189;</text>
  <text class="tick" x="66" y="254">0</text>
  <text class="tick" x="48" y="168" transform="rotate(-90 48 168)" text-anchor="middle">probability</text>

  <rect class="bar" x="110" y="170" width="70" height="80" rx="4"/>
  <rect class="bar" x="225" y="170" width="70" height="80" rx="4"/>
  <text class="value" x="145" y="160">0.500</text>
  <text class="value" x="260" y="160">0.500</text>
  <text class="bar-label" x="145" y="278">|0&#10217;</text>
  <text class="bar-label" x="260" y="278">|1&#10217;</text>

  <line class="arrow" x1="368" y1="168" x2="458" y2="168" marker-end="url(#sn-arrow)"/>
  <text class="small" x="413" y="146">sample</text>
  <text class="small" x="413" y="196">100 times</text>

  <line class="ideal" x1="535" y1="170" x2="775" y2="170"/>
  <text class="small" x="756" y="162" text-anchor="end">exact 0.50</text>

  <rect class="bar-two" x="560" y="176.4" width="70" height="73.6" rx="4"/>
  <rect class="bar-two" x="675" y="163.6" width="70" height="86.4" rx="4"/>
  <text class="value" x="595" y="166">46</text>
  <text class="value" x="710" y="154">54</text>
  <text class="bar-label" x="595" y="278">|0&#10217;</text>
  <text class="bar-label" x="710" y="278">|1&#10217;</text>
</svg>
