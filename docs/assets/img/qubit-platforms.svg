<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="qp-title qp-desc">
  <title id="qp-title">Four physical ways to build a qubit</title>
  <desc id="qp-desc">Simplified icons for a superconducting transmon circuit, a trapped ion, a photonic circuit and a neutral atom in optical tweezers.</desc>
  <defs>
    <marker id="qp-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="fill-blue" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="qp-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="fill-orange" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .panel { fill: #f5f7fd; stroke: #e1e6f0; stroke-width: 1.5; }
    .name { font-size: 14px; font-weight: 600; text-anchor: middle; fill: #151a2b; }
    .enc { font-size: 11.5px; text-anchor: middle; fill: #5a6478; }
    .enc-blue { font-size: 10px; text-anchor: middle; fill: #1e40af; }
    .enc-orange { font-size: 10px; text-anchor: middle; fill: #ea580c; }
    .stroke-blue { stroke: #1e40af; stroke-width: 2.4; fill: none; }
    .stroke-orange { stroke: #ea580c; stroke-width: 2.6; fill: none; }
    .fill-blue { fill: #1e40af; }
    .fill-orange { fill: #ea580c; }
    .fill-soft { fill: #eef2ff; }
    .fill-orange-soft { fill: #ea580c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #111728; stroke: #212a3f; }
      .name { fill: #e6eaf4; }
      .enc { fill: #9aa6bd; }
      .enc-blue { fill: #93b4ff; }
      .enc-orange { fill: #fb923c; }
      .stroke-blue { stroke: #93b4ff; }
      .stroke-orange { stroke: #fb923c; }
      .fill-blue { fill: #93b4ff; }
      .fill-orange { fill: #fb923c; }
      .fill-soft { fill: #1b1c3f; }
    }
  </style>

  <rect class="panel" x="20" y="20" width="195" height="265" rx="14"/>
  <rect class="panel" x="235" y="20" width="195" height="265" rx="14"/>
  <rect class="panel" x="450" y="20" width="195" height="265" rx="14"/>
  <rect class="panel" x="665" y="20" width="195" height="265" rx="14"/>

  <!-- Superconducting transmon -->
  <g>
    <rect class="stroke-blue" x="72" y="58" width="90" height="90" rx="10"/>
    <line class="stroke-blue" x1="95" y1="95" x2="139" y2="95"/>
    <line class="stroke-blue" x1="95" y1="110" x2="139" y2="110"/>
    <line class="stroke-blue" x1="117" y1="110" x2="117" y2="125"/>
    <rect class="stroke-orange" x="107" y="125" width="20" height="20" rx="3"/>
    <line class="stroke-orange" x1="109" y1="127" x2="125" y2="143"/>
    <line class="stroke-orange" x1="125" y1="127" x2="109" y2="143"/>
    <path class="stroke-orange" d="M117 26 q -10 6 0 12 q 10 6 0 12" marker-end="url(#qp-arrow-orange)"/>
  </g>
  <text class="name" x="117" y="205">Superconducting</text>
  <text class="enc" x="117" y="226">transmon circuit</text>
  <text class="enc" x="117" y="246">~10 mK</text>

  <!-- Trapped ion -->
  <g>
    <rect class="fill-soft" x="277" y="66" width="111" height="12" rx="6"/>
    <rect class="fill-soft" x="277" y="146" width="111" height="12" rx="6"/>
    <rect class="stroke-blue" x="277" y="66" width="111" height="12" rx="6"/>
    <rect class="stroke-blue" x="277" y="146" width="111" height="12" rx="6"/>
    <circle class="fill-orange-soft" cx="332" cy="112" r="22"/>
    <circle class="fill-orange" cx="332" cy="112" r="9"/>
    <line class="stroke-blue" x1="262" y1="190" x2="314" y2="132" marker-end="url(#qp-arrow-blue)"/>
    <text class="enc-blue" x="260" y="203">laser</text>
  </g>
  <text class="name" x="332" y="225">Trapped ion</text>
  <text class="enc" x="332" y="246">atomic levels</text>

  <!-- Photonic -->
  <g>
    <rect class="fill-soft" x="470" y="102" width="118" height="18" rx="9"/>
    <rect class="stroke-blue" x="470" y="102" width="118" height="18" rx="9"/>
    <path class="stroke-orange" d="M480 111 q 8 -10 16 0 q 8 10 16 0 q 8 -10 16 0 q 8 10 16 0 q 8 -10 16 0"/>
    <rect class="stroke-blue" x="598" y="88" width="8" height="46" rx="2"/>
    <line class="stroke-blue" x1="598" y1="92" x2="606" y2="100"/>
    <line class="stroke-blue" x1="598" y1="106" x2="606" y2="114"/>
    <line class="stroke-blue" x1="598" y1="120" x2="606" y2="128"/>
    <circle class="stroke-blue" cx="626" cy="111" r="13"/>
    <line class="stroke-orange" x1="626" y1="111" x2="634" y2="103"/>
    <text class="enc-orange" x="535" y="151">single photon</text>
  </g>
  <text class="name" x="547" y="225">Photonic</text>
  <text class="enc" x="547" y="246">polarization or path</text>

  <!-- Neutral atom -->
  <g>
    <path class="fill-soft" d="M722 40 L744 40 L768 104 L744 104 Z"/>
    <path class="stroke-blue" d="M722 40 L744 40 L768 104 L744 104 Z"/>
    <path class="fill-soft" d="M802 40 L780 40 L756 104 L780 104 Z"/>
    <path class="stroke-blue" d="M802 40 L780 40 L756 104 L780 104 Z"/>
    <circle class="fill-orange-soft" cx="762" cy="112" r="20"/>
    <circle class="fill-orange" cx="762" cy="112" r="8"/>
    <text class="enc-blue" x="762" y="178">laser tweezer</text>
  </g>
  <text class="name" x="762" y="225">Neutral atom</text>
  <text class="enc" x="762" y="246">atomic levels</text>
</svg>
